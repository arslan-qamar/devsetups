- name: Check if nmcli is available
  command: nmcli --version
  register: nmcli_check
  changed_when: false
  when: state == 'present'

- name: Wait for NetworkManager to be ready
  command: nmcli general status
  register: libvirt_nm_ready
  until: libvirt_nm_ready.rc == 0
  retries: 10
  delay: 3
  changed_when: false
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - nmcli_check.rc == 0

- name: Determine uplink interface for bridge
  set_fact:
    libvirt_bridge_uplink: "{{ libvirt_bridge_uplink_interface | default(ansible_default_ipv4.interface | default('')) }}"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0

# On reruns the default route may already belong to a bridge. Resolve its
# physical port instead of attempting to enslave the bridge to itself.
- name: Resolve physical uplink when the selected interface is a bridge
  shell: |
    set -eu
    interface={{ libvirt_bridge_uplink | quote }}
    if [ -d "/sys/class/net/$interface/bridge" ]; then
      count=0
      uplink=''
      for port in /sys/class/net/"$interface"/brif/*; do
        name=${port##*/}
        if [ -e "/sys/class/net/$name/device" ]; then
          uplink=$name
          count=$((count + 1))
        fi
      done
      if [ "$count" -ne 1 ]; then
        echo "Cannot resolve a unique physical uplink for $interface; set libvirt_bridge_uplink_interface explicitly." >&2
        exit 1
      fi
      printf '%s\n' "$uplink"
    else
      printf '%s\n' "$interface"
    fi
  register: libvirt_resolved_uplink
  changed_when: false
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0

- name: Use resolved bridge uplink
  set_fact:
    libvirt_bridge_uplink: "{{ libvirt_resolved_uplink.stdout | trim }}"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0

- name: Reject attaching the bridge to itself
  assert:
    that:
      - libvirt_bridge_uplink != (libvirt_bridge_name | default('br0'))
    fail_msg: "The bridge cannot be its own uplink; set libvirt_bridge_uplink_interface to a physical interface."
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0

- name: Check uplink for conflicting direct virtual interfaces
  command:
    argv: [ip, -j, -d, link, show]
  register: libvirt_host_links
  changed_when: false
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0

- name: Reject direct virtual interfaces before changing host networking
  vars:
    libvirt_conflicting_links: >-
      {{ libvirt_host_links.stdout | from_json
         | selectattr('link', 'defined')
         | selectattr('link', 'equalto', libvirt_bridge_uplink)
         | selectattr('linkinfo', 'defined')
         | selectattr('linkinfo.info_kind', 'defined')
         | selectattr('linkinfo.info_kind', 'in', ['macvtap', 'macvlan', 'ipvlan'])
         | map(attribute='ifname') | list }}
  assert:
    that:
      - libvirt_conflicting_links | length == 0
    fail_msg: >-
      Cannot bridge {{ libvirt_bridge_uplink }} while direct virtual interfaces
      {{ libvirt_conflicting_links | join(', ') }} use it. Shut down or migrate
      the VMs/containers owning these interfaces, then rerun. Pausing a VM does
      not release its interfaces. No host connections have been changed by this run.
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0

- name: Get active NM connection for bridge uplink
  shell: |
    nmcli -t -f NAME,DEVICE connection show --active | awk -F: '$2=="{{ libvirt_bridge_uplink }}" {print $1; exit}'
  register: libvirt_uplink_connection
  changed_when: false
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0

- name: Check if br0 bridge connection already exists
  command: nmcli connection show {{ libvirt_bridge_name | default('br0') }}
  register: libvirt_br0_check
  changed_when: false
  failed_when: false
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0
    - libvirt_uplink_connection.stdout | length > 0

- name: Ensure br0 bridge connection exists
  command: nmcli connection add type bridge ifname {{ libvirt_bridge_name | default('br0') }} con-name {{ libvirt_bridge_name | default('br0') }}
  register: libvirt_br0_add
  changed_when: libvirt_br0_add.rc == 0
  failed_when: libvirt_br0_add.rc != 0 and ('already exists' not in (libvirt_br0_add.stderr | default('') | lower))
  retries: 5
  delay: 5
  until: libvirt_br0_add.rc == 0 or ('already exists' in (libvirt_br0_add.stderr | default('') | lower))
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0
    - libvirt_uplink_connection.stdout | length > 0
    - (libvirt_br0_check.rc | default(1)) != 0

- name: Configure br0 networking
  command: nmcli connection modify {{ libvirt_bridge_name | default('br0') }} bridge.stp no ipv4.method auto ipv6.method auto connection.autoconnect yes
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0
    - libvirt_uplink_connection.stdout | length > 0

- name: Attach uplink connection to br0
  command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ libvirt_uplink_connection.stdout }}"
      - connection.master
      - "{{ libvirt_bridge_name | default('br0') }}"
      - connection.slave-type
      - bridge
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0
    - libvirt_uplink_connection.stdout | length > 0

- name: Activate and verify host bridge
  become: yes
  environment:
    DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - nmcli_check.rc == 0
    - libvirt_bridge_uplink | length > 0
    - libvirt_uplink_connection.stdout | length > 0
  block:
    # Activate the port first so DHCP on the bridge has a working uplink.
    - name: Activate uplink connection
      command:
        argv: [nmcli, --wait, '60', connection, up, "{{ libvirt_uplink_connection.stdout }}"]

    - name: Activate bridge connection
      command:
        argv: [nmcli, --wait, '60', connection, up, "{{ libvirt_bridge_name | default('br0') }}"]

    - name: Verify uplink is attached to the intended bridge
      command:
        argv: [readlink, -f, "/sys/class/net/{{ libvirt_bridge_uplink }}/master"]
      register: libvirt_uplink_master
      changed_when: false
      retries: 10
      delay: 3
      until:
        - libvirt_uplink_master.rc == 0
        - (libvirt_uplink_master.stdout | basename) == (libvirt_bridge_name | default('br0'))

    - name: Verify bridge has carrier and a global IPv4 address
      command:
        argv: [ip, -j, -4, address, show, dev, "{{ libvirt_bridge_name | default('br0') }}", scope, global]
      register: libvirt_bridge_addresses
      changed_when: false
      retries: 20
      delay: 3
      until:
        - libvirt_bridge_addresses.rc == 0
        - (libvirt_bridge_addresses.stdout | from_json | length) > 0
        - (libvirt_bridge_addresses.stdout | from_json | first).operstate == 'UP'
        - ((libvirt_bridge_addresses.stdout | from_json | first).addr_info | length) > 0

- name: Warn when bridge automation was skipped
  debug:
    msg: "Skipping host bridge automation (nmcli missing, no uplink detected, or no active NM connection for uplink)."
  when:
    - state == 'present'
    - libvirt_configure_host_bridge | default(true)
    - (nmcli_check.rc | default(1)) != 0 or
      (libvirt_bridge_uplink | default('') | length == 0) or
      (libvirt_uplink_connection.stdout | default('') | length == 0)

- name: Remove br0 bridge connection
  command: nmcli connection delete {{ libvirt_bridge_name | default('br0') }}
  register: libvirt_br0_delete
  changed_when: libvirt_br0_delete.rc == 0
  failed_when: false
  become: yes
  when:
    - state == 'absent'
    - libvirt_configure_host_bridge | default(true)

- name: Restore uplink from bridge on removal
  shell: |
    conn=$(nmcli -t -f NAME,TYPE connection show | awk -F: '$2=="bridge-slave" {print $1}' | head -n1)
    [ -n "$conn" ] && nmcli connection modify "$conn" connection.master "" connection.slave-type "" && nmcli connection up "$conn" || true
  become: yes
  changed_when: false
  failed_when: false
  when:
    - state == 'absent'
    - libvirt_configure_host_bridge | default(true)
